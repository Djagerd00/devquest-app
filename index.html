  --subtle: #6e6e88;
  --purple: #ac92ff;
  --violet: #a78bfa;
  --blue: #7eabff;
  --mint: #69d6b4;
  --peach: #efaf80;
  --rose: #eb91b0;
  --radius: 20px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-width: 320px;
}
button,
input,
textarea,
select {
  font: inherit;
}
button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button,
a {
  touch-action: manipulation;
}
button {
  color: inherit;
  cursor: pointer;
}
button {
  border: 0;
}
a {
  color: inherit;
  text-decoration: none;
}
button:disabled {
  cursor: default;
  opacity: 0.5;
}
button,
input,
select,
textarea,
a {
  outline-offset: 4px;
}
button:focus-visible,
a:focus-visible {
  outline: 2px solid #c5b3ff;
}
input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: var(--purple);
  box-shadow: 0 0 0 3px #a78bfa14;
}
button {
  transition:
    background 0.2s,
    transform 0.2s,
    border-color 0.2s;
}
button:active {
  transform: scale(0.98);
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-weight: 650;
  letter-spacing: -0.035em;
}
img {
  max-width: 100%;
  display: block;
}
.icon {
  flex-shrink: 0;
  vertical-align: middle;
}
button .icon {
  pointer-events: none;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
[hidden] {
  display: none !important;
}
::selection {
  background: #8b5cf65c;
  color: #fff;
}
.sidebar {
  width: 236px;
  position: fixed;
  inset: 0 auto 0 0;
  background: #131420;
  border-right: 1px solid #242536;
  padding: 34px 21px 25px;
  display: flex;
  flex-direction: column;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 25px;
  font-weight: 750;
  letter-spacing: -1px;
}
.brand img {
  filter: drop-shadow(0 3px 10px #a78bfa28);
}
.brand-light {
  font-weight: 400;
  color: #c4b9e5;
}
.brand small {
  display: block;
  font-size: 8px;
  font-weight: 550;
  letter-spacing: 1.3px;
  color: #77768e;
  margin-top: 6px;
}
.nav-label {
  font-size: 9px;
  letter-spacing: 1.5px;
  font-weight: 650;
  color: #6e6f86;
  margin: 49px 12px 17px;
}
.sidebar nav {
  display: grid;
  gap: 7px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 13px;
  color: #9594ad;
  font-size: 13px;
  padding: 13px 15px;
  border: 1px solid transparent;
  border-radius: 10px;
  min-height: 47px;
  font-weight: 550;
}
.nav-item:hover {
  background: #1c1c2e;
  color: #e9e2ff;
}
.nav-item.active {
  color: #baa3ff;
  background: linear-gradient(100deg, #34274c99, #25203b88);
  border-color: #54407445;
}
.nav-count {
  margin-left: auto;
  font-size: 10px;
  font-weight: 600;
  background: #29293d;
  padding: 3px 6px;
  border-radius: 5px;
}
.active .nav-count {
  background: #a78bfa24;
}
.sidebar-bottom {
  margin-top: auto;
}
.local-note {
  display: flex;
  gap: 10px;
  align-items: center;
  border-top: 1px solid #28283b;
  padding-top: 24px;
  color: #817a9b;
}
.local-note > .icon {
  width: 18px;
}
.local-note span {
  font-size: 10px;
  color: #b4acc6;
  line-height: 1.6;
}
.local-note small {
  display: block;
  font-size: 9px;
  color: #74728a;
}
.version {
  font-size: 9px;
  letter-spacing: 0.5px;
  color: #64647b;
  display: block;
  margin: 25px 0 0 28px;
}
.workspace {
  margin-left: 236px;
}
.topbar {
  height: 83px;
  border-bottom: 1px solid #232434;
  padding: 0 42px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.breadcrumb {
  font-size: 11px;
  color: #79788e;
  display: flex;
  align-items: center;
  gap: 14px;
}
.breadcrumb .icon {
  width: 12px;
}
.breadcrumb span {
  color: #c1bcd3;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 19px;
}
.network-state {
  font-size: 10px;
  color: #8d8c9f;
  display: flex;
  align-items: center;
  gap: 7px;
}
.network-state .icon {
  width: 14px;
  color: #7bbaa5;
}
.network-state.is-offline .icon {
  color: var(--peach);
}
.avatar {
  position: relative;
  width: 37px;
  height: 37px;
  border: 1px solid #6d539f;
  background: #302642;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: #cfbaff;
}
.avatar > .icon {
  width: 20px;
}
.avatar span {
  position: absolute;
  bottom: -5px;
  right: -5px;
  font-size: 9px;
  background: #bca1ff;
  color: #211834;
  border: 2px solid #10111c;
  border-radius: 5px;
  min-width: 17px;
  padding: 1px 3px;
  font-weight: 800;
}
.demo-badge {
  background: #a78bfa0d;
  color: #ac9ecc;
  border: 1px solid #a78bfa25;
  border-radius: 6px;
  font-size: 10px;
  padding: 4px 8px;
  min-height: 28px;
}
.mobile-brand,
.bottom-nav {
  display: none;
}
main {
  padding: 34px 42px 44px;
  max-width: 1450px;
  margin: auto;
  outline: none;
  min-height: calc(100vh - 138px);
}
.desktop-footer {
  border-top: 1px solid #202130;
  margin: 0 42px;
  padding: 21px 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  color: #63637b;
}
.desktop-footer span:last-child {
  display: flex;
  align-items: center;
  gap: 8px;
}
.desktop-footer .icon {
  width: 13px;
  color: #8f78b0;
}
.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 29px;
}
.eyebrow {
  text-transform: uppercase;
  font-size: 9px;
  letter-spacing: 1.7px;
  font-weight: 650;
  color: #9390a9;
}
.page-heading > .button {
  flex-shrink: 0;
}
.page-heading h1 {
  font-size: 29px;
  line-height: 1.25;
  margin: 9px 0 10px;
  overflow-wrap: anywhere;
}
.wave {
  color: #c3adfa;
  display: inline-block;
  margin-left: 4px;
  font-size: 28px;
}
.page-heading p {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
}
.button {
  min-height: 43px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 17px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.4;
  font-weight: 600;
  border: 1px solid transparent;
}
.button > .icon {
  width: 17px;
  height: 17px;
}
.primary {
  background: linear-gradient(105deg, #b095fa, #9273ed);
  color: #201437;
  box-shadow: 0 4px 18px #9071e617;
  border-color: #bda2ff44;
}
.primary:hover {
  background: linear-gradient(105deg, #c5afff, #ab8cf8);
}
.secondary {
  background: #242437;
  border-color: #38354e;
  color: #d8cdec;
}
.secondary:hover {
  background: #302b43;
  border-color: #7b639d;
}
.ghost {
  background: transparent;
  color: #a7a0bb;
}
.ghost:hover {
  background: #a78bfa12;
}
.danger {
  color: #f597a6 !important;
}
.danger-button {
  background: #eb82911c;
  border: 1px solid #eb82913d;
  color: #ffadb9;
}
.danger-button:hover {
  background: #eb829133;
}
.full-width {
  width: 100%;
}
.icon-button {
  display: grid;
  place-items: center;
  background: transparent;
  color: #89849f;
  min-width: 38px;
  min-height: 38px;
  border-radius: 9px;
}
.icon-button:hover {
  background: #a78bfa15;
  color: #c4acf5;
}
.icon-button > .icon {
  width: 19px;
}
.text-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: #b8a1e7;
  white-space: nowrap;
  min-height: 35px;
}
.text-link .icon {
  width: 14px;
}
.text-link:hover {
  color: #dccbff;
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
.section-heading h2 {
  font-size: 17px;
}
.section-heading p {
  font-size: 10px;
  color: #7f7d95;
  margin-top: 7px;
  line-height: 1.5;
}
.overview-grid {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 21px;
}
.hero-card {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  min-height: 291px;
  border-radius: var(--radius);
  border: 1px solid #65528155;
  background:
    radial-gradient(ellipse at 87% 30%, #68459558, transparent 58%),
    linear-gradient(115deg, #272039, #29213f 55%, #29203a);
  padding: 25px 27px 21px;
}
.hero-card:before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.25;
  z-index: -1;
  background-image: radial-gradient(#c4a2ff 1px, transparent 1px);
  background-size: 53px 47px;
  mask-image: linear-gradient(90deg, transparent, #000);
}
.hero-label {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #bb9be8;
  font-size: 8px;
  letter-spacing: 1.6px;
  font-weight: 650;
}
.hero-label > .icon {
  width: 13px;
  height: 13px;
}
.hero-content {
  position: relative;
  z-index: 2;
}
.hero-content h2 {
  font-size: 30px;
  line-height: 1.18;
  margin: 15px 0 10px;
  letter-spacing: -0.8px;
}
.hero-content p {
  font-size: 11px;
  color: #aaa0bd;
  line-height: 1.7;
}
.hero-link {
  display: flex;
  align-items: center;
  gap: 9px;
  background: none;
  padding: 10px 0 0;
  color: #cab1ff;
  font-size: 10px;
  min-height: 35px;
}
.hero-link > .icon {
  width: 14px;
}
.hero-crystal {
  position: absolute;
  width: 225px;
  height: 225px;
  top: -5px;
  right: 1px;
  z-index: 1;
  filter: drop-shadow(0 16px 25px #7657d535);
  animation: float 7s ease-in-out infinite;
}
.hero-progress {
  margin-top: 14px;
  position: relative;
  z-index: 3;
}
.hero-progress > div:first-child {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 9px;
}
.level-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: #e5d6ff;
}
.level-badge .icon {
  width: 15px;
  height: 15px;
}
.xp-value {
  font-size: 10px;
  font-weight: 600;
  color: #e2d3fa;
}
.xp-value span {
  color: #8b819f;
  font-weight: 400;
}
.progress-track {
  height: 5px;
  border-radius: 6px;
  background: #8d7baf20;
  overflow: hidden;
}
.progress-track i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #9266d8, #c2a3ff);
  border-radius: inherit;
  transition: width 0.45s ease;
}
.hero-progress-caption {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 9px;
  color: #9a8caa;
  font-size: 8px;
  line-height: 1.5;
}
.daily-card {
  border-radius: var(--radius);
  border: 1px solid #323044;
  background: linear-gradient(130deg, #1e1e2c, #1a1b29);
  padding: 23px 24px 18px;
}
.daily-title {
  display: flex;
  gap: 11px;
  align-items: center;
}
.daily-title h2 {
  font-size: 15px;
}
.daily-title p {
  font-size: 9px;
  color: #8d879e;
  margin-top: 5px;
}
.streak-number {
  font-size: 22px;
  color: #efb589;
  margin-left: auto;
  font-weight: 650;
  white-space: nowrap;
}
.streak-number small {
  font-size: 11px;
  color: #9c8c87;
  font-weight: 500;
}
.icon-tile {
  width: 39px;
  height: 39px;
  border-radius: 11px;
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  background: #a78bfa12;
  color: var(--purple);
}
.icon-tile .icon {
  width: 20px;
  height: 20px;
}
.violet {
  --accent: var(--violet);
}
.blue {
  --accent: var(--blue);
}
.mint {
  --accent: var(--mint);
}
.peach {
  --accent: var(--peach);
}
.rose {
  --accent: var(--rose);
}
.icon-tile,
.project-icon {
  color: var(--accent, var(--purple));
  background: color-mix(in srgb, var(--accent, var(--purple)) 12%, transparent);
}
.daily-main {
  display: flex;
  align-items: center;
  gap: 20px;
  margin: 24px 0 23px;
}
.day-ring {
  --progress: 0%;
  width: 98px;
  height: 98px;
  padding: 6px;
  background: conic-gradient(from 0deg, #a58ae9 var(--progress), #303041 0);
  border-radius: 50%;
  flex-shrink: 0;
  transform: rotate(-0deg);
}
.day-ring > div {
  width: 100%;
  height: 100%;
  background: #1d1d2b;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  box-shadow: inset 0 0 15px #a78bfa08;
}
.day-ring strong {
  font-size: 27px;
  font-weight: 650;
  letter-spacing: -1px;
}
.day-ring strong span {
  font-size: 17px;
  color: #7e778e;
  font-weight: 450;
}
.day-ring small {
  font-size: 9px;
  color: #9b93ab;
  margin-top: 3px;
}
.daily-main .eyebrow {
  font-size: 7px;
  letter-spacing: 1.2px;
  color: #78768d;
}
.daily-main h3 {
  font-size: 13px;
  margin: 8px 0 6px;
  letter-spacing: -0.2px;
}
.daily-main p {
  font-size: 10px;
  line-height: 1.7;
  color: #9990aa;
}
.xp-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #b89ce7;
  background: #a78bfa0b;
  border: 1px solid #a78bfa17;
  border-radius: 6px;
  font-size: 9px;
  margin-top: 10px;
  padding: 4px 6px;
}
.xp-pill > .icon {
  width: 11px;
  height: 11px;
}
.week-strip {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid #343044;
  padding-top: 13px;
  gap: 7px;
}
.week-day {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-direction: column;
  font-size: 8px;
  color: #7f7a94;
}
.day-check {
  width: 24px;
  height: 24px;
  border: 1px solid #393547;
  border-radius: 7px;
  display: grid;
  place-items: center;
}
.day-check .icon {
  width: 12px;
  height: 12px;
}
.week-day.done .day-check {
  background: #a78bfa12;
  border-color: #6b568855;
  color: #b89be9;
}
.week-day.today {
  color: #cfb3f6;
}
.week-day.today .day-check {
  background: #b79be9;
  color: #2c2040;
  border-color: #c1a8e9;
}
.day-check i {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #5e556e;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 17px;
  margin: 20px 0 34px;
}
.stat-card {
  display: flex;
  align-items: center;
  gap: 15px;
  border-radius: 13px;
  border: 1px solid #2b2b3d;
  background: #191a27;
  padding: 16px 20px;
  text-align: left;
}
.stat-card > div {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.stat-card strong {
  font-size: 23px;
  font-weight: 600;
  line-height: 1;
}
.stat-card strong small {
  font-size: 11px;
  color: #777189;
  font-weight: 450;
}
.stat-card div > span {
  font-size: 10px;
  color: #9992aa;
}
.stat-arrow {
  width: 13px;
  margin-left: auto;
  color: #6e6682;
}
.dashboard-grid {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 25px;
}
.task-list {
  background: var(--panel);
  border: 1px solid #2b2b3d;
  border-radius: 15px;
  overflow: hidden;
}
.task-card {
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 89px;
  padding: 16px 18px;
  position: relative;
}
.task-card + .task-card {
  border-top: 1px solid #2a293c;
}
.task-check {
  width: 22px;
  height: 22px;
  border: 1.5px solid #4a435e;
  background: #ffffff02;
  border-radius: 7px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  position: relative;
}
.task-check:after {
  content: "";
  position: absolute;
  inset: -11px;
}
.task-check:hover {
  background: #a78bfa20;
  border-color: #a78bfa;
}
.task-check.checked {
  background: #9c82e6;
  color: #221a36;
  border-color: #9c82e6;
}
.task-check > .icon {
  width: 14px;
  height: 14px;
}
.task-content {
  text-align: left;
  min-width: 0;
  flex: 1;
  background: none;
  padding: 4px 0;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.task-title {
  font-size: 11px;
  font-weight: 550;
  color: #e0dbea;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.task-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #8c839f;
  font-size: 9px;
  flex-wrap: wrap;
  line-height: 1.4;
}
.task-project-name {
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.project-dot {
  width: 5px;
  height: 5px;
  background: var(--accent);
  display: inline-block;
  border-radius: 50%;
  flex-shrink: 0;
}
.due {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #7f7891;
  margin-left: 5px;
}
.due > .icon {
  width: 10px;
  height: 10px;
}
.due.overdue {
  color: #ec9ba4;
}
.task-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 13px;
  flex-shrink: 0;
}
.priority-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #7ec8ae;
  margin-right: 2px;
}
.priority-dot.high {
  background: #df9c7d;
}
.priority-dot.medium {
  background: #b59be8;
}
.task-xp {
  font-size: 10px;
  color: #b19ad4;
  font-weight: 550;
  white-space: nowrap;
}
.task-xp small {
  font-size: 8px;
  color: #80738f;
}
.in-progress-label {
  font-size: 8px;
  color: #9c9cdd;
  display: inline-block;
}
.is-done .task-title {
  text-decoration: line-through;
  color: #8c839d;
}
.is-done .task-right {
  opacity: 0.6;
}
.add-task-line {
  margin-top: 10px;
  background: transparent;
  border: 1px dashed #383146;
  border-radius: 10px;
  padding: 12px 15px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #9484ac;

  background: #a78bfa18;

  place-items: center;

  margin-bottom: 15px;
}
#toast {
  position: fixed;
  bottom: 30px;
  left: calc(50% + 118px);
  transform: translate(-50%, 15px);
  opacity: 0;
  pointer-events: none;
  z-index: 1000;
  max-width: calc(100% - 40px);
  width: max-content;
  padding: 14px 20px;
  border-radius: 12px;
  background: #352a48;
  border: 1px solid #8d6ba560;
  color: #eadcf7;
  box-shadow: 0 10px 50px #0006;
  font-size: 12px;
  line-height: 1.6;
  transition:
    opacity 0.2s,
    transform 0.2s;
}
#toast.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}
#toast.error {
  background: #3d2231;
  border-color: #b7627e66;
  color: #ffc1ce;
}
.noscript {
  padding: 30px;
  text-align: center;
}
@keyframes float {
  0%,
  100% {
    transform: translateY(0) rotate(-3deg);
  }
  50% {
    transform: translateY(-8px) rotate(1deg);
  }
}
@keyframes sheet-in {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

  function download(text, filename) {
    const url = URL.createObjectURL(
      new Blob([text], { type: "application/json;charset=utf-8" })
    );
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3e4);
  }
  async function importFile(file) {

        "Восстановить данные?",

    } catch (error) {
      notify(error.message, "error");

  document.addEventListener("submit", (event) => {

            status: values.status,

              fields
            );

              ...fields,
              id: uid(),
              createdAt: (/* @__PURE__ */ new Date()).toISOString()

        closeSheet();

      let earned = 0;

        const id = form.dataset.id || uid();

          description: values.description.trim(),

          priority: values.priority,
          due: values.due,
          status: "todo"

          Object.assign(
            draft.tasks.find((t) => t.id === id),
            fields

          draft.tasks.push({
            ...fields,
            id,
            createdAt: (/* @__PURE__ */ new Date()).toISOString()

      }
